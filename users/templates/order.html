<div>
    <form action="/orders/" method="post">
        {% csrf_token %}
        {{ form }}
        <p> Создать заказ для внутренней лаборатории</p>
        {% for tube in tubes %}
        <li>{{ tube }} <input type="number" id={{ tube.id }} name={{ forloop.counter }} min="1" max="5" default="0" /></li>
        {% endfor %}
        <input type="submit" value="Создать">
    </form>

    
</div>
