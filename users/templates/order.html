{% extends 'base.html' %}
{% load static %}

{% block title %}Создание заказа{% endblock %}

{% block css %}
<link rel="stylesheet" type="text/css" href="{% static 'css/order.css' %}">
{% endblock %}

{% block content %}
<div class="order-container">
    <form class="order-form" action="/orders/" method="post">
        {% csrf_token %}
        <div class="form-row">
            <label for="{{ form.destination.id_for_label }}">{{ form.destination.label }}</label>
            {{ form.destination }}
        </div>
        
        <ul class="tube-list">
        {% for tube in tubes %}
            <li class="tube-item" data-tube-id="{{ tube.id }}">
                {{ tube }}
                <div class="number-control">
                    <input type="number" 
                           id="tube_{{ tube.id }}" 
                           name="tube_{{ forloop.counter }}" 
                           min="1" 
                           max="5" 
                           value="1"
                           data-tube-name="{{ tube }}" />
                    <div class="spinner-buttons">
                        <button type="button" class="spinner-button up" data-action="increment"></button>
                        <button type="button" class="spinner-button down" data-action="decrement"></button>
                    </div>
                </div>
            </li>
        {% endfor %}
        </ul>
        <input type="submit" value="Создать" class="submit-button">
    </form>
</div>
{% endblock %}

{% block javascript %}
<script>
    (function() {
        const MIN_VALUE = 1;
        const MAX_VALUE = 5;

        function handleSpinnerClick(e) {
            e.preventDefault();
            const button = e.currentTarget;
            const numberControl = button.closest('.number-control');
            const input = numberControl.querySelector('input[type="number"]');
            const action = button.dataset.action;
            const currentValue = parseInt(input.value) || 0;
            
            let newValue = currentValue;
            if (action === 'increment' && currentValue < MAX_VALUE) {
                newValue = currentValue + 1;
            } else if (action === 'decrement' && currentValue > MIN_VALUE) {
                newValue = currentValue - 1;
            }

            if (newValue !== currentValue) {
                updateInputValue(input, newValue);
            }
        }

        function updateInputValue(input, newValue) {
            input.value = newValue;
            input.style.transform = 'scale(1.1)';
            setTimeout(() => {
                input.style.transform = 'scale(1)';
            }, 150);

            // Dispatch change event
            const event = new Event('change', { bubbles: true });
            input.dispatchEvent(event);

            // Update hidden input if exists
            const tubeId = input.closest('.tube-item').dataset.tubeId;
            const tubeName = input.dataset.tubeName;
            console.log(`Updated tube ${tubeName} (ID: ${tubeId}) to value: ${newValue}`);
        }

        function validateInput(input) {
            let value = parseInt(input.value) || 0;
            if (value < MIN_VALUE) value = MIN_VALUE;
            if (value > MAX_VALUE) value = MAX_VALUE;
            input.value = value;
        }

        function handleKeyboardInput(e) {
            const input = e.currentTarget;
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.preventDefault();
                const currentValue = parseInt(input.value) || 0;
                
                let newValue = currentValue;
                if (e.key === 'ArrowUp' && currentValue < MAX_VALUE) {
                    newValue = currentValue + 1;
                } else if (e.key === 'ArrowDown' && currentValue > MIN_VALUE) {
                    newValue = currentValue - 1;
                }

                if (newValue !== currentValue) {
                    updateInputValue(input, newValue);
                }
            }
        }

        function validateForm(e) {
            const form = e.currentTarget;
            const inputs = form.querySelectorAll('input[type="number"]');
            let isValid = true;
            let invalidInputs = [];

            inputs.forEach(input => {
                const value = parseInt(input.value) || 0;
                const tubeName = input.dataset.tubeName;
                
                if (value < MIN_VALUE || value > MAX_VALUE) {
                    isValid = false;
                    invalidInputs.push(tubeName);
                    input.style.borderColor = '#e53e3e';
                    setTimeout(() => {
                        input.style.borderColor = '';
                    }, 2000);
                }
            });

            if (!isValid) {
                e.preventDefault();
                alert(`Пожалуйста, проверьте количество для следующих пробирок:\n${invalidInputs.join('\n')}\nЗначения должны быть от ${MIN_VALUE} до ${MAX_VALUE}`);
            }
        }

        // Initialize all event listeners when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Spinner buttons
            document.querySelectorAll('.spinner-button').forEach(button => {
                button.addEventListener('click', handleSpinnerClick);
            });

            // Number inputs
            document.querySelectorAll('input[type="number"]').forEach(input => {
                input.addEventListener('change', () => validateInput(input));
                input.addEventListener('keydown', handleKeyboardInput);
                input.addEventListener('keypress', (e) => {
                    if (!/[0-9]/.test(e.key)) {
                        e.preventDefault();
                    }
                });
            });

            // Form submission
            document.querySelector('.order-form').addEventListener('submit', validateForm);
        });
    })();
</script>
{% endblock %}

<style>
    p {
      color: blue;
      font-size: 20px;
    }
    div {
      margin-top: 10%;  
      margin-left: 10%;
      align-self: center;
      font-size: 26px;
    }
    form {
      margin-top: 10%;  
      margin-left: 10%;
      align-self: center;
      font-size: 26px;
    }
        
    
    .spinner-arrows {
    position: absolute;
    right: 5px;
    display: flex;
    flex-direction: column;
    pointer-events: none;
    }

    /* Пользовательская кнопка для увеличения значения */
    .spinner-arrows .up {
    background-color: blue;
    }

    /* Пользовательская кнопка для уменьшения значения */
    .spinner-arrows .down {
    background-color: red;
    }
    
  </style>
