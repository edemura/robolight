{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="{% static 'css/order.css' %}">
</head>
<body>
    <div class="order-container">
        <form class="order-form" action="/orders/" method="post">
            {% csrf_token %}
            <div class="form-row">
                <label for="{{ form.destination.id_for_label }}">{{ form.destination.label }}</label>
                {{ form.destination }}
            </div>
            
            <ul class="tube-list">
            {% for tube in tubes %}
                <li class="tube-item">
                    {{ tube }}
                    <div class="number-control">
                        <input type="number" id={{ tube.id }} name={{ forloop.counter }} min="1" max="5" value="1" />
                        <div class="spinner-buttons">
                            <button type="button" class="spinner-button up" onclick="this.previousElementSibling.stepUp()"></button>
                            <button type="button" class="spinner-button down" onclick="this.previousElementSibling.previousElementSibling.stepDown()"></button>
                        </div>
                    </div>
                </li>
            {% endfor %}
            </ul>
            <input type="submit" value="Создать" class="submit-button">
        </form>
    </div>

    <script>
        // Prevent form submission on spinner button clicks
        document.querySelectorAll('.spinner-button').forEach(button => {
            button.addEventListener('click', (e) => {
                e.preventDefault();
            });
        });
    </script>
</body>
</html>

<style>
    p {
      color: blue;
      font-size: 20px;
    }
    div {
      margin-top: 10%;  
      margin-left: 10%;
      align-self: center;
      font-size: 26px;
    }
    form {
      margin-top: 10%;  
      margin-left: 10%;
      align-self: center;
      font-size: 26px;
    }
        
    
    .spinner-arrows {
    position: absolute;
    right: 5px;
    display: flex;
    flex-direction: column;
    pointer-events: none;
    }

    /* Пользовательская кнопка для увеличения значения */
    .spinner-arrows .up {
    background-color: blue;
    }

    /* Пользовательская кнопка для уменьшения значения */
    .spinner-arrows .down {
    background-color: red;
    }
    
  </style>
